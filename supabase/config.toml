project_id = "depannage-web-pwa-preview"

[auth]
site_url = "https://depannage-electricite-git-integration-web-pwa-brafas-projects.vercel.app"
additional_redirect_urls = ["https://depannage-electricite-git-integration-web-pwa-brafas-projects.vercel.app/auth/confirm", "https://depannage-electricite-git-integration-web-pwa-brafas-projects.vercel.app/auth/reset-password"]

[auth.email.template.confirmation]
subject = "Confirmez votre adresse e-mail"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Réinitialisez votre mot de passe"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.email_change]
subject = "Confirmez votre nouvelle adresse e-mail"
content_path = "./supabase/templates/email-change.html"

# Phone verification is activated for the provider recipe in the dedicated environment.
[auth.sms]
enable_signup = false
enable_confirmations = false

[auth.sms.vonage]
enabled = false
api_key = "env(SUPABASE_AUTH_SMS_VONAGE_API_KEY)"
api_secret = "env(SUPABASE_AUTH_SMS_VONAGE_API_SECRET)"
from = "env(SUPABASE_AUTH_SMS_VONAGE_FROM)"
